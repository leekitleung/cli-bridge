name: Quality Gate

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]

env:
  PNPM_CACHE_FOLDER: .pnpm-store

jobs:
  quality-gate:
    name: Release Quality Review
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run Quality Gate
        run: node skills/release-quality-review/scripts/review-gate.mjs --profile release-gate --round ${{ github.run_number }}

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-review-report
          path: quality-reports/
          retention-days: 30

  skill-gate:
    name: Skill Registry Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify skill registry
        run: node scripts/sync-skills.ts verify

      - name: Check skill lockfile
        run: node scripts/sync-skills.ts check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -rn "api[_-]key\|secret\|password\|token" --include="*.ts" apps packages scripts | \
             grep -v "\.d\.ts\|_test\|mock\|example\|fixture\|test\|spec"; then
            echo "WARNING: Potential secrets found!"
            exit 1
          fi
          echo "No obvious secrets found."

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
