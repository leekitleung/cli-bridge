# Skill Review Gate - 自动质量门禁
name: Skill Review Gate

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.claude/**'
      - 'AGENTS.md'
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:
    inputs:
      skill_path:
        description: 'Skill path to review'
        required: false
        default: ''

jobs:
  skill-quality-review:
    name: Skill Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Determine skill path
        id: skill-path
        run: |
          if [ "${{ github.event.inputs.skill_path }}" ]; then
            echo "path=${{ github.event.inputs.skill_path }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Find changed skill directories
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^skills/' | cut -d'/' -f2 | uniq)
            if [ -n "$CHANGED" ]; then
              echo "path=skills/$(echo $CHANGED | head -1)" >> $GITHUB_OUTPUT
            else
              echo "path=" >> $GITHUB_OUTPUT
            fi
          else
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: Run Skill Self-Review
        if: steps.skill-path.outputs.path != ''
        run: |
          echo "Reviewing: ${{ steps.skill-path.outputs.path }}"
          node skills/release-quality-review/scripts/review-runner.mjs \
            --target "${{ steps.skill-path.outputs.path }}" \
            --profile release-gate \
            --round 1

      - name: Check Gate Result
        if: steps.skill-path.outputs.path != ''
        run: |
          RESULT_FILE="quality-reports/round-001/gate-result.json"
          if [ -f "$RESULT_FILE" ]; then
            PASSED=$(cat "$RESULT_FILE" | grep -o '"passed":true' || echo "")
            if [ -n "$PASSED" ]; then
              echo "✅ Skill quality gate PASSED"
              exit 0
            else
              echo "❌ Skill quality gate FAILED"
              cat "$RESULT_FILE"
              exit 1
            fi
          else
            echo "⚠️ No gate result file found, checking scores manually"
            # Fallback: check if all result.yaml have score >= 90
            SCORES=$(find quality-reports/round-001 -name 'result.yaml' -exec grep -h '^score:' {} \; 2>/dev/null | grep -o '[0-9]\+' | sort -n | head -1)
            if [ -n "$SCORES" ] && [ "$SCORES" -ge 90 ]; then
              echo "✅ All reviewers scored >= 90"
              exit 0
            else
              echo "❌ Some reviewers scored < 90"
              exit 1
            fi
          fi

      - name: Upload Review Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-review-report
          path: quality-reports/

  skill-sync-check:
    name: Skill Sync Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify skill lockfile
        run: pnpm skill:verify

      - name: Check for uncommitted skills
        run: |
          node scripts/sync-skills.ts --check
          if [ $? -ne 0 ]; then
            echo "❌ Skills out of sync with lockfile"
            exit 1
          fi
          echo "✅ Skill lockfile is valid"
