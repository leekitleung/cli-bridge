name: release-gate
description: Pre-release quality gate with full reviewer coverage

required_reviewers:
  - product-flow
  - architecture-maintainer
  - release-verifier
  - destructive-qa

conditional_reviewers:
  native-designer:
    when:
      - changed_files_match: ["**/*.css", "**/*.tsx", "**/*.jsx", "**/*.vue", "**/*.html", "**/ui/**"]
      - evidence_has: ["screenshots", "design-files"]
  zero-doc-user:
    when:
      - is_user_facing: true
      - is_public_release: true
  terminal-veteran:
    when:
      - changed_files_match: ["**/cli/**", "**/scripts/**", "**/bin/**", "**/commands/**", "**/local-server/**"]
  data-security:
    when:
      - changed_files_match: ["**/auth/**", "**/storage/**", "**/sync/**", "**/token/**"]
      - diff_contains: ["token", "secret", "password", "key", "credential", "localStorage", "cookie", "session"]
  performance:
    when:
      - changed_files_match: ["**/polling/**", "**/background/**", "**/worker/**", "**/cron/**"]
      - has_performance_sensitive_code: true

thresholds:
  min_score: 90
  fail_on_redlines: true
  fail_on_p0_p1_blockers: true

commands:
  test: "pnpm test"
  build: "pnpm build"
  lint: "pnpm lint"
  typecheck: "pnpm typecheck"

evidence_required:
  - manifest.yaml
  - git-diff.patch
  - git-status.txt
  - test.log
  - build.log
  - typecheck.log

aliases:
  vibe-coder: product-flow
  new-user: zero-doc-user
  aesthetic-designer: native-designer
  quality-breaker: destructive-qa
