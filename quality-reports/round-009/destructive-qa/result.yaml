# ============================================================================
# A1: BROKEN ACCESS CONTROL
# ============================================================================
access_control:
  - id: AC-001
    severity: medium
    category: owasp-a1
    title: "innerHTML usage without sanitization in project-console.ts"
    description: >
      The file project-console.ts uses direct innerHTML assignments with template
      literals that include user-controlled data (e.g., event labels, project names).
      While escapeHtml() is used for some values, dynamic content from events
      and external sources is inserted via innerHTML without consistent validation.
    evidence:
      - file: "apps/local-server/src/routes/project-console.ts"
        lines: [815, 1154, 1157, 1220, 1223, 1790, 1812, 1817, 2186, 3334, 3343]
        pattern: "innerHTML with dynamic template literals"
    impact: >
      Potential XSS if attacker can control event labels or other dynamic content
      displayed in the console UI. However, data originates from trusted local
      server processes.
    recommendation: >
      - Audit all innerHTML usages for user-controlled input paths
      - Consider using textContent for plain text, or a sanitization library
      - Ensure all dynamic content goes through escapeHtml() or similar
    status: needs_review

  - id: AC-002
    severity: low
    category: owasp-a1
    title: "ALLOWED_ORIGINS constant used without validation in origin-guard.ts"
    description: >
      The origin-guard.ts implements origin validation, but relies on ALLOWED_ORIGINS
      from shared constants. The implementation correctly:
      - Rejects non-loopback web origins for claim routes (ADR-0025)
      - Allows only loopback, Chrome extension, and explicit allowlist origins
      - Uses pairing tokens as real authentication boundary
    evidence:
      - file: "apps/local-server/src/security/origin-guard.ts"
        pattern: "ALLOWED_ORIGINS.includes(origin)"
    impact: >
      Origin validation is properly implemented. However, extension origin pattern
      only validates syntax ([a-p]{32}), not actual extension ID.
    recommendation: >
      - Consider binding extension IDs at install time for stricter validation
      - Document that pairing tokens are the real authentication boundary
    status: adequate

# ============================================================================
# A2: CRYPTOGRAPHIC FAILURES
# ============================================================================
cryptographic:
  - id: CF-001
    severity: medium
    category: owasp-a2
    title: "Sensitive content redaction via regex patterns"
    description: >
      The redaction.ts module implements regex-based sensitive data detection:
      - Private keys, API keys, tokens, passwords
      - GitHub tokens, AWS keys, Bearer tokens
      - Authorization headers
    evidence:
      - file: "apps/local-server/src/security/redaction.ts"
        patterns:
          - "-----BEGIN [A-Z ]*PRIVATE KEY-----"
          - "sk-[A-Za-z0-9_-]{20,}"
          - "gh[pousr]_[A-Za-z0-9_]{20,}"
    impact: >
      Regex patterns may miss edge cases or be bypassed with obfuscation.
      However, this is defense-in-depth; primary protection is token authentication.
    recommendation: >
      - Add test cases for edge-case inputs
      - Consider entropy-based detection for unknown credential formats
      - Document coverage limitations
    status: adequate

# ============================================================================
# A3: INJECTION
# ============================================================================
injection:
  - id: INJ-001
    severity: high
    category: owasp-a3
    title: "undici HTTP header injection via Set-Cookie percent-decoding (CWE-93)"
    description: >
      The undici library has a known vulnerability (GHSA-p88m-4jfj-68fv) where
      HTTP header injection via Set-Cookie percent-decoding can occur. The
      project uses undici for HTTP client operations.
    evidence:
      - file: "node_modules/undici"
        version_range: "7.0.0 - 7.27.2"
        cve: "CVE related to GHSA-p88m-4jfj-68fv"
        cvss_score: 5.9
    impact: >
      An attacker controlling a Set-Cookie response could inject arbitrary headers
      or manipulate cookie attributes, potentially leading to session hijacking.
    recommendation: >
      - Run `npm audit fix` to update undici to >= 7.28.0
      - Implement additional header validation on incoming responses
      - Consider adding Content-Security-Policy headers
    status: fix_available

  - id: INJ-002
    severity: high
    category: owasp-a3
    title: "undici TLS certificate validation bypass via SOCKS5 ProxyAgent"
    description: >
      The undici library has a vulnerability (GHSA-vmh5-mc38-953g) where TLS
      certificate validation can be bypassed when using SOCKS5 ProxyAgent.
    evidence:
      - file: "node_modules/undici"
        version_range: "7.23.0 - 7.27.2"
        cve: "GHSA-vmh5-mc38-953g"
        cvss_score: 7.4
        cwe: "CWE-295"
    impact: >
      MITM attacks possible when using SOCKS5 proxy, as TLS certificate
      validation is bypassed.
    recommendation: >
      - Run `npm audit fix` to update undici to >= 7.28.0
      - If using proxy, ensure it is trusted and on secure network
      - Consider certificate pinning for critical endpoints
    status: fix_available

# ============================================================================
# A5: SECURITY MISCONFIGURATION
# ============================================================================
security_misconfiguration:
  - id: SM-001
    severity: medium
    category: owasp-a5
    title: "esbuild development server arbitrary file read on Windows (CWE-22)"
    description: >
      The esbuild package has a vulnerability (GHSA-g7r4-m6w7-qqqr) that allows
      arbitrary file read when running the development server on Windows.
    evidence:
      - file: "node_modules/esbuild"
        version_range: "0.27.3 - 0.28.0"
        cve: "GHSA-g7r4-m6w7-qqqr"
        cvss_score: 2.5
        cwe: "CWE-22"
    impact: >
      On Windows, attackers could read arbitrary files via specially crafted
      URLs to the esbuild dev server. Impact is low as esbuild is dev-only.
    recommendation: >
      - Update esbuild via `npm audit fix` (>= 0.28.1)
      - Avoid running esbuild dev server in production
      - Consider firewall rules for dev server port
    status: fix_available

  - id: SM-002
    severity: low
    category: owasp-a5
    title: "Rate limiter X-Forwarded-For trust removal"
    description: >
      The rate-limiter.ts correctly no longer trusts X-Forwarded-For header,
      preventing IP spoofing attacks to bypass rate limiting.
    evidence:
      - file: "apps/local-server/src/security/rate-limiter.ts"
        pattern: "SECURITY FIX: 不再信任 X-Forwarded-For"
    impact: >
      Good security practice - X-Forwarded-For can be trivially spoofed by
      attackers to bypass rate limits.
    recommendation: >
      - Consider adding trusted proxy header configuration for deployment
      - Document which reverse proxy configurations are supported
    status: adequate

# ============================================================================
# EXCEPTION HANDLING ISSUES
# ============================================================================
exception_handling:
  - id: EH-001
    severity: medium
    category: exception_handling
    title: "Silent catch blocks with generic error handling"
    description: >
      Multiple catch blocks in the codebase swallow errors without proper
      error classification or re-throwing with context. Examples:
      - bridge-api.ts: Many hydration try-catch blocks log but continue
      - bridge-client.ts: Generic catch(err) without type narrowing
      - server.ts: Error handlers use String(err) without stack traces
    evidence:
      - file: "apps/local-server/src/routes/bridge-api.ts"
        lines: [1675, 1678, 1697-1749]
        pattern: "catch (e) { hydrationFailures++; logger.warn(...) }"
      - file: "apps/extension/src/content/bridge-client.ts"
        line: 103
        pattern: "catch (err)"
      - file: "apps/local-server/src/server.ts"
        lines: [404, 451, 491]
        pattern: "err instanceof Error ? err.message : String(err)"
    impact: >
      - Loss of error context and stack traces
      - Silent failures may mask security-relevant errors
      - Difficult to debug production issues
    recommendation: >
      - Use structured error types with error codes
      - Log error.stack for debugging, not just err.message
      - Consider error boundary patterns for async operations
      - Add error classification (security-relevant vs. operational)
    status: needs_improvement

# ============================================================================
# PERMISSION CONTROL ISSUES
# ============================================================================
permission_control:
  - id: PC-001
    severity: medium
    category: permission_control
    title: "Command allowlist enforcement with pattern-based forbidden arg detection"
    description: >
      The command-runner.ts implements a hardened execution gate:
      - Fixed allowlist: only 'codex' and 'claude' commands
      - Forbidden arg patterns: dangerously-skip-permissions, bypasspermissions, etc.
      - shell: false enforced
      - Timeout and output size limits
    evidence:
      - file: "apps/local-server/src/adapters/command-runner.ts"
        allowlist: "['codex', 'claude']"
        forbidden_patterns: [30-36]
      - file: "apps/local-server/src/process/contained-process.ts"
        shell: false
        detached: false
    impact: >
      Good security posture for command execution. However, forbidden pattern
      detection uses .includes() which could potentially be bypassed with
      clever encoding in some scenarios.
    recommendation: >
      - Consider stricter validation (exact match instead of substring)
      - Add test cases for bypass attempts
      - Document security guarantees and limitations
    status: adequate

  - id: PC-002
    severity: medium
    category: permission_control
    title: "executionPermissionProfile stored in binding without validation"
    description: >
      The executionPermissionProfile is stored in automation bindings but
      validation of its values appears inconsistent. Mismatches are detected
      but the allowed values are not centrally defined.
    evidence:
      - file: "apps/local-server/src/storage/execution-proposal-store.ts"
        lines: [94-95, 167-168]
        pattern: "step.tier !== binding.executionPermissionProfile"
    impact: >
      If executionPermissionProfile can be set to arbitrary strings by an
      attacker, they might bypass permission checks by specifying a permissive profile.
    recommendation: >
      - Define allowed values as a const/enum
      - Validate profile at binding creation time
      - Add audit logging for profile changes
    status: needs_review

