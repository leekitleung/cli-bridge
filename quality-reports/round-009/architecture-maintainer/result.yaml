## 6. Recommendations

### Priority 1 (Critical)

1. **Consolidate Dispatchers** (AR-001, AR-002)
   - Deprecate `execution-dispatcher.ts` (v1)
   - Migrate `dispatchExecutionProposal` logic into `ExecutionDispatcher` or a dedicated `ExecutionProposalDispatcher`
   - Update all callers

2. **Fix State Sync Issues** (AR-011, AR-012)
   - Add explicit state transition methods that update both stores atomically
   - Or introduce a saga/transaction pattern for cross-store operations

### Priority 2 (Important)

3. **Remove Duplicate Code** (AR-004, AR-005)
   - Extract shared tick handling logic into base class or shared utility
   - Share error keyword lists as a constant module

4. **Consolidate Gate Execution** (AR-006, AR-013)
   - Deprecate `GateAwareExecutionIntegration`
   - Integrate its logic into `GoalLoopRunner` or remove entirely

5. **Fix Double Registration** (AR-007)
   - Make executor registration happen once at startup
   - Use `setExecutorRegistry` pattern consistently

### Priority 3 (Nice to Have)

6. **Add Configuration for Error Keywords** (AR-010)
   - Externalize error detection patterns
   - Allow per-project customization

7. **Improve Test Coverage** (AR-009)
   - Add unit tests for `GoalOrchestrator.advance()`
   - Add integration tests for executor selection

