| Risk | Likelihood | Impact | Mitigation |
|------|------------|--------|------------|
| State inconsistency after partial failure | MEDIUM | HIGH | Implement transactional boundaries |
| Wrong executor selected | LOW | MEDIUM | Add capability matching tests |
| Gate bypass (security) | LOW | HIGH | Already mitigated by orchestrator design |
| Memory leak from pending maps | MEDIUM | LOW | Already has cleanup in `cleanupExpiredExecutions()` |

