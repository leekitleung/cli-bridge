## User Path Closure Analysis

### Path 1: Goal -> Plan -> Execute

```
User creates goal
  -> /bridge/goals (POST)
  -> creates goal in goalStore
  -> goal.status = "draft"

User requests plan
  -> /bridge/goals/:id/plan (POST)
  -> GoalOrchestrator.generatePlan()
  -> plan.steps populated with intents
  -> plan.status = "draft"

User approves plan
  -> /bridge/goals/:id/plan/approve (POST)
  -> goalStore.approvePlan()
  -> goal.status = "approved"
  -> plan.status = "approved"

User starts loop
  -> /bridge/goals/:id/loop/start (POST)
  -> GoalLoopRunner.start()
  -> AutomationLoopRun created
  -> Poll timer scheduled
  -> tick() begins
```

Status: CLOSED - All steps verified in tests

### Path 2: Gate Approval Flow

```
Loop tick() calls orchestrator.advance()
  -> returns step-gated for mutating step
  -> handleStepGated() creates pendingGateApproval
  -> pending gates accessible via /loop/gates

User approves gate
  -> /bridge/goals/:id/loop/approve (POST)
  -> runner.approveGate(executionId)
  -> dispatcher.dispatch() to executor
  -> WorkBuddy executes command
  -> Step marked as done
  -> tick() continues
```

Status: CLOSED - Gate approval flow implemented

### Path 3: Verification & Audit

```
After step-completed:
  -> verifyStepCompletion() called
  -> Checks stderr for error keywords
  -> isLikelyFalsePositive() avoids false positives
  -> If verification fails: failStep()
  -> If verification passes: step marked done

Loop completion:
  -> plan-completed: pausePlan() called
  -> step-failed: cancelGoal() called
  -> loop status updated to done/failed/cancelled
```

Status: CLOSED - Verification with false positive handling

### Path 4: Error Recovery

```
Tick error:
  -> caught in scheduleNextTick
  -> loop.stop() called
  -> cleanup performed

Execution failure:
  -> result.ok = false
  -> error returned to approveGate
  -> User notified via API response

No executor available:
  -> dispatch() returns no-executor-available error
  -> Test coverage for this scenario
```

Status: CLOSED - Error paths covered

## State Handling Analysis

states:
  goal:
    draft: Initial state on creation
    planned: After plan generated
    approved: After plan approved
    executing: After loop started
    done: After all steps completed
    failed: After unrecoverable error
    cancelled: After user cancellation

  plan:
    draft: Initial state
    awaiting-approval: Before user review
    approved: After user approves
    executing: During loop execution
    paused: After completion
    cancelled: After failure or cancellation

  step:
    pending: Awaiting execution
    running: Currently executing
    done: Successfully completed
    failed: Execution failed
    skipped: User skipped

  loop:
    draft: Created but not started
    running: Actively polling
    done: Completed successfully
    failed: Encountered error
    cancelled: Stopped by user

