## Recommendations

1. **扩展加载体验优化**: 提供 `npm run build-extension && npm start` 一键启动，减少用户手动操作
2. **Node.js 依赖提示**: README 开头增加 Node.js 22+ 检查和安装指引
3. **术语表**: 考虑添加术语表或-glossary 文件解释 BridgePacket, Source Relay 等概念
4. **中文文档**: 考虑提供中文版 README 或 QUICKSTART

