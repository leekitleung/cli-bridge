### LOW (4)

#### L-1: Origin guard accepts null origin
- **File:** `apps/local-server/src/security/origin-guard.ts`
- **Line:** 41-43
- **Severity:** LOW
- **Description:** |
  `isAllowedOrigin()` returns `true` when `origin` is null. The comment explains this
  is intentional (same-origin or non-browser clients), but curl-based attacks can
  bypass the origin check entirely.

- **Mitigation:** Pairing token is still required as the real authentication gate.
  Low risk because the server binds to loopback only.

#### L-2: Sensitive content redaction regex limitations
- **File:** `apps/local-server/src/security/redaction.ts`
- **Line:** 16-69
- **Severity:** LOW
- **Description:** |
  The redaction rules use regex patterns that may miss edge cases:
  - Private key pattern requires exact header/footer format
  - AWS keys only match specific prefix patterns
  - No detection for JWT tokens, GCP credentials, or generic bearer tokens

- **Recommendation:** Add additional patterns for:
  - JWT tokens: `eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*`
  - GCP keys: `[A-Za-z0-9_-]+@<project>\.iam\.gserviceaccount\.com`

#### L-3: Output truncation may leave partial data
- **File:** `apps/local-server/src/workbuddy/command-backend.ts`
- **Line:** 206-222
- **Severity:** LOW
- **Description:** |
  When output exceeds `outputCapBytes`, the truncation happens by slicing to the cap,
  but `stdout` and `stderr` may be interleaved. A large stderr chunk could be truncated
  mid-line, potentially exposing partial sensitive data.

- **Recommendation:** Truncate at line boundaries or after the cap is reached, ensure
  complete lines are preserved where possible.

#### L-4: No process zombie cleanup on error path
- **File:** `apps/local-server/src/workbuddy/command-backend.ts`
- **Line:** 270-279
- **Severity:** LOW
- **Description:** |
  When `child.on('error', ...)` fires, the timer is cleared but the child process
  may not be killed. If the error occurs after the process started but before
  clean termination, a zombie process could remain.

- **Recommendation:** Call `killProcess(child.pid, true)` in the error handler.

