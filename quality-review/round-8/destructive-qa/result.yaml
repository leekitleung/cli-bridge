### HIGH (2)

#### H-1: cmd.exe allowlist bypass on Windows
- **File:** `apps/local-server/src/workbuddy/command-backend.ts`
- **Line:** 51-66 (`isAllowed` function)
- **Severity:** HIGH
- **Description:** |
  The `isAllowed()` function unconditionally allows `cmd.exe` on Windows:
  ```typescript
  if (process.platform === 'win32' && command.toLowerCase() === 'cmd.exe') {
    return true;
  }
  ```
  While command arguments are parsed via `parseArgv()` which respects quoting, the
  `/c` flag passed later allows executing arbitrary commands. For example:
  - Input: `cmd.exe /c dir ..\\..\\..\\..\\windows\\system32`
  - Input: `cmd.exe /c type C:\\Windows\\System32\\drivers\\etc\\hosts`
  - Input: `cmd.exe /c powershell -enc <base64>`

  The shell metacharacter check at line 90 blocks some patterns but allows `/c` since
  `/` is not in the blocklist.

- **Failure Scenario:** A prompt containing `cmd.exe /c net user attacker P@ssw0rd /add`
  would execute with elevated privileges if the server runs as administrator.

- **Recommendation:** Remove the blanket `cmd.exe` allow. If Windows built-in commands
  are required, create an explicit allowlist like:
  ```typescript
  const WINDOWS_ALLOWED_COMMANDS = new Set(['cmd.exe', 'echo', 'type', 'copy', 'move', 'del']);
  if (isWindows && WINDOWS_ALLOWED_COMMANDS.has(command.toLowerCase())) { ... }
  ```
  Additionally, validate that argv[1] is one of the known safe built-in commands
  (e.g., `/c` followed by a safe command), not arbitrary executable paths.

- **Fix Status:** Unfixed

#### H-2: Working directory path traversal
- **File:** `apps/local-server/src/workbuddy/command-backend.ts`
- **Line:** 160
- **Severity:** HIGH
- **Description:** |
  The working directory is resolved from user-controlled `task.workingDirectory`:
  ```typescript
  const workDir = task.workingDirectory ? resolve(task.workingDirectory) : cwd;
  ```
  While `resolve()` normalizes the path, it does not prevent traversal to parent
  directories of the intended sandbox root. If `defaultCwd` is set to a project
  directory, an attacker can specify `workingDirectory: '../../../root'` to escape.

- **Failure Scenario:** `task.workingDirectory = '..\\..\\..\\..\\'` combined with
  a command like `type C:\\Windows\\System32\\config\\SAM` could read sensitive files.

- **Recommendation:** Validate that the resolved working directory is still under
  the intended sandbox root:
  ```typescript
  const workDir = task.workingDirectory ? resolve(task.workingDirectory) : cwd;
  if (!workDir.startsWith(resolve(cwd))) {
    return { ok: false, ..., failureReason: 'working-directory-escape' };
  }
  ```

- **Fix Status:** Unfixed

