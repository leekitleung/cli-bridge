### MEDIUM (3)

#### M-1: Insufficient rate limiter per-IP tracking
- **File:** `apps/local-server/src/security/rate-limiter.ts`
- **Line:** 40-45
- **Severity:** MEDIUM
- **Description:** |
  The rate limiter only tracks by direct connection IP, which is correct. However,
  the `SimpleRateLimiter` class has no mechanism to track across multiple IPs if an
  attacker uses a rotating proxy or botnet. Additionally, the cleanup timer runs
  every 60 seconds but does not handle entries with expired `resetAt` that were not
  cleaned up in time, potentially allowing bursts after the window expires.

- **Failure Scenario:** An attacker with 100 different source IPs could make 10,000
  requests/minute against an endpoint limited to 100 requests/IP.

- **Recommendation:** Consider implementing:
  1. Global request counter regardless of IP
  2. Sliding window rate limiting instead of fixed window
  3. Additional fingerprinting (User-Agent, Accept-Language hash)

- **Fix Status:** Documented as known limitation

#### M-2: Token comparison timing attack
- **File:** `apps/local-server/src/security/pairing.ts`
- **Line:** 35-42
- **Severity:** MEDIUM
- **Description:** |
  The `verifyPairingToken` function uses `timingSafeEqual` which is good, but the
  length comparison at line 35-37 leaks the expected token length:
  ```typescript
  if (receivedToken.length !== expectedToken.length) {
    return false;
  }
  ```
  An attacker can determine the token length by measuring response time differences.

- **Failure Scenario:** |
  Timing differences: length mismatch returns immediately (~0.1ms) vs full comparison
  (~1-5ms depending on length). Attacker can iteratively determine token length.

- **Recommendation:** Perform `timingSafeEqual` on a fixed-length hash of both tokens
  instead of direct comparison, or always perform the full timing-safe comparison
  regardless of length (pad/normalize inputs).

- **Fix Status:** Partial - length leak still present

#### M-3: Session claim nonce reuse not atomic
- **File:** `apps/local-server/src/security/local-auto-pair-session.ts`
- **Line:** 143-155
- **Description:** |
  The `claimExtensionSession` function checks `claimUsedAt` before setting it, but
  this check-then-set is not atomic. In a concurrent request scenario:
  1. Request A: checks `claimUsedAt` -> undefined (pass)
  2. Request B: checks `claimUsedAt` -> undefined (pass)
  3. Request A: sets `claimUsedAt = now()`
  4. Request B: sets `claimUsedAt = now()` (overwrites A's value)

  Both requests may receive valid extension session tokens.

- **Failure Scenario:** Race condition allows a single nonce to be claimed multiple
  times if concurrent requests arrive within the same execution tick.

- **Recommendation:** Use atomic compare-and-swap or a mutex to ensure only one
  successful claim per nonce:
  ```typescript
  if (record.claimUsedAt) return { ok: false, message: 'nonce already used' };
  record.claimUsedAt = now(); // Atomic in single-threaded, but not with concurrent handlers
  ```

- **Fix Status:** Unfixed - only safe if Node.js event loop is single-threaded per instance

