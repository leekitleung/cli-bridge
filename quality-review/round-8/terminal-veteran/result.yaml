## command-backend.ts Assessment

### Strengths
1. **Allowlist Enforcement**: Only allowlisted commands execute
2. **Shell Metacharacter Detection**: Blocks injection attempts even with `shell: false`
3. **Multi-layer DoS Protection**: Argument count, total length, per-argument limits
4. **Output Capping**: Prevents memory exhaustion
5. **Process Tree Termination**: Windows `taskkill /T` kills children properly
6. **Force Kill Fallback**: 2-second grace period before SIGKILL

### Issues Found

| Severity | Category | Issue | Location |
|----------|----------|-------|----------|
| Medium | Error Message | `stderr: err.message` loses error context | Line 275 |
| Low | Logging | No command execution logging | Line 183 |
| Low | Logging | No allowlist check failure details | Line 150-157 |
| Low | Edge Case | `spawn` errors not categorized | Line 270-279 |
| Low | Windows | cmd.exe allowlist bypass on Windows | Line 53-55 |

### Specific Observations

**1. Allowlist Bypass (Windows)**
```typescript
// Line 53-55: cmd.exe is always allowed on Windows
if (process.platform === 'win32' && command.toLowerCase() === 'cmd.exe') {
  return true;
}
```
**Risk**: Any command can be run via `cmd.exe /c <command>`. This effectively bypasses the allowlist on Windows.

**Recommendation**: Either remove this exception or document it clearly as intentional for Windows compatibility.

**2. Error Context Loss**
```typescript
// Line 275: Only passes message, loses stack/context
stderr: err.message,

// Better:
stderr: `Spawn failed: ${err.message} (code: ${err.code})`,
```

**3. Missing Structured Logging**
```typescript
// No logging of:
child.stdout.on('data', ...)

// Should log (debug level):
console.debug(`[CommandBackend] ${task.taskId}: stdout +${chunk.length}b`);
```

**4. Timeout Handling Improvement Needed**
```typescript
// Line 196-203: Timer continues if process exits exactly at timeout
const timer = setTimeout(() => {
  timedOut = true;
  killProcess(child.pid, false);
  ...
}, timeoutMs);
```

**Race Condition**: If process exits within 1ms of timeout, `timedOut` flag may be set before `close` event fires.

**5. Output Truncation Logic Bug**
```typescript
// Lines 208-209: Truncates stdout but keeps full stderr
if (stdout.length + stderr.length > outputCapBytes) {
  outputTruncated = true;
  stdout = stdout.slice(0, outputCapBytes);  // Only truncates stdout!
}
```

**Issue**: If stderr is larger, it remains full length, violating the cap.

---

## Recommendations Summary

### High Priority
1. **Fix allowlist bypass on Windows** - cmd.exe exception negates allowlist security
2. **Fix output truncation logic** - Only one stream gets truncated, not both

### Medium Priority
3. **Enhance error messages with context** - Include paths, method, stack traces
4. **Add structured request logging** - For debugging production issues
5. **Fix race condition in timeout handling** - Check if process already exited

### Low Priority
6. **Add command execution audit log** - Track what commands ran (for security review)
7. **Consider removing cmd.exe allowlist** - Document if intentional
8. **Add request ID tracking** - For distributed tracing

