    item: 创建 docs/README.md 作为文档索引，清晰分类（Getting Started / Guides / API / Reference / Troubleshooting）
  - priority: high
    item: 在 README.md 增加 Troubleshooting/FAQ 部分，覆盖常见错误场景
  - priority: medium
    item: 统一文档语言，建议全部使用英文（或全部中文）
  - priority: medium
    item: 为主流程添加截图或 GIF 演示（Console UI、Extension 连接流程）
  - priority: low
