# Skill Registry
# Declares required skills and their trust levels
# DO NOT add skills from unknown sources

version: "1.0"
trust_policy:
  auto_update: false
  allow_external: false

skills:
  release-quality-review:
    description: Multi-dimensional code review with deterministic quality gates
    source: local
    path: skills/release-quality-review
    trust_level: L0  # Built-in, fully trusted
    auto_update: false
    required: true
    adapters:
      claude: .claude/skills/release-quality-review
      codex: .agents/skills/release-quality-review

